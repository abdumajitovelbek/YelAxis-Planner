name: Firefox persistence diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - name: Exercise Firefox persistence and the local website
        run: |
          docker run --rm --ipc=host --network=host \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$(command -v node):/usr/local/bin/node:ro" \
            mcr.microsoft.com/playwright:v1.62.0-noble \
            bash -lc 'npm install -g pnpm@11.9.0 >/dev/null && pnpm --filter web run test:firefox'
      - name: Keep synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-failure-screenshots
          path: /tmp/yelaxis-persistence-firefox-*-failure.png
          if-no-files-found: ignore
          retention-days: 7
