name: Browser/backend diagnostic

on:
  workflow_dispatch:
    inputs:
      gate:
        description: Focused gate to diagnose; full CI remains the release gate
        type: choice
        default: firefox
        options:
          - firefox
          - backend

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Exercise the selected focused gate
        env:
          DIAGNOSTIC_GATE: ${{ inputs.gate }}
        run: bash .github/scripts/browser-gates.sh "$DIAGNOSTIC_GATE"
      - name: Keep synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-failure-screenshots
          path: ${{ runner.temp }}/browser-artifacts/yelaxis-*-failure.png
          if-no-files-found: ignore
          retention-days: 7
