name: Firefox persistence diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Exercise Firefox persistence and the local website
        run: |
          mkdir -p "$RUNNER_TEMP/firefox-artifacts"
          docker run --rm --ipc=host --network=host -e CI=true \
            -v "$PWD:$PWD" -w "$PWD" \
            -v "$RUNNER_TEMP/firefox-artifacts:/tmp" \
            -v "$(command -v node):/usr/local/bin/node:ro" \
            mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07 \
            bash -lc 'npm install -g pnpm@11.9.0 >/dev/null && pnpm install --frozen-lockfile && pnpm --filter web run test:firefox'
      - name: Keep synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-failure-screenshots
          path: ${{ runner.temp }}/firefox-artifacts/yelaxis-persistence-firefox-*-failure.png
          if-no-files-found: ignore
          retention-days: 7
