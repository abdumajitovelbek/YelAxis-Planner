name: Firefox persistence diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright-core install --with-deps firefox
      - name: Exercise Firefox persistence and the local website
        env:
          DEBUG: pw:api
        run:
          xvfb-run -a --server-args='-screen 0 2560x2160x24' env FIREFOX_HEADED=1 pnpm --filter web
          run test:firefox
      - name: Keep synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-failure-screenshots
          path: /tmp/yelaxis-persistence-firefox-*-failure.png
          if-no-files-found: ignore
          retention-days: 7
