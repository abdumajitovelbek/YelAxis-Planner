name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workspace quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run aggregate repository checks
        run: pnpm run check

      - name: Audit all dependency advisories
        run: pnpm run release:dependencies

      - name: Build and inspect local-only release artifact
        run: pnpm --filter web run build && pnpm run release:artifact

  browser:
    name: Browser, backend and release verification
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - run: pnpm install --frozen-lockfile
      - name: Install pinned browsers and OS libraries
        run: pnpm --filter web exec playwright-core install --with-deps chromium firefox
      - name: Start independent disposable account stack without printing keys
        run: pnpm run supabase:start
      - name: Apply migrations to the disposable database
        run: pnpm run supabase:reset
      - name: Verify browser journeys and backend isolation
        run:
          xvfb-run -a --server-args='-screen 0 2560x2160x24' env FIREFOX_HEADED=1 pnpm run
          web:verify
      - name: Verify release behavior and performance bounds
        run:
          xvfb-run -a --server-args='-screen 0 2560x2160x24' env FIREFOX_HEADED=1 pnpm run
          release:verify
      - name: Keep synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: /tmp/yelaxis-*-failure.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop this job's disposable stack
        if: always()
        run: pnpm run supabase:stop
