name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Workspace quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run aggregate repository checks
        run: pnpm run check

      - name: Audit all dependency advisories
        run: pnpm run release:dependencies

      - name: Build and inspect local-only release artifact
        run: pnpm --filter web run build && pnpm run release:artifact

  browser:
    name: Browser, backend and release verification
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Verify browser, backend and release gates in the pinned browser image
        run: bash .github/scripts/browser-gates.sh
      - name: Keep synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-screenshots
          path: ${{ runner.temp }}/browser-artifacts/yelaxis-*-failure.png
          if-no-files-found: ignore
          retention-days: 7
